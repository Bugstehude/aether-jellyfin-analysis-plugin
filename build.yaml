changelog: "0.2.2.0: centre-weighted dominant colours — the palette now describes the subject instead of the dark border (measured: dominant colour rgb(7,3,6) -> rgb(74,38,38)). The algorithm key moves to aether-visual/1.1.0, so EVERY stored analysis is invalidated and the whole library is re-analyzed on the next run — expect hours of background work and no cache hits until it finishes. Also includes 0.2.1.5: stop analyzing every item twice. The scheduled task and the after-scan hook could run at the same time and each iterate the whole library (serialized only per item), doubling a multi-hour run; whole runs are now serialized (one active, one queued, extra triggers skipped). Also includes 0.2.1.4: pick analysis libraries from a checkbox list instead of pasting GUIDs."
