changelog: "0.2.7.2: hotfix — v0.2.7.1 (and, discovered simultaneously, v0.2.7.0) shipped a stale DLL: the release notes/version number were correct, but the actual packaged binary was still 0.2.6.2's code, because tools/package-plugin.sh trusted an out-of-band Release build that had gone stale rather than building it fresh itself. The chapter-markers feature and the storage display never actually reached anyone who installed 0.2.7.0/0.2.7.1. package-plugin.sh no longer trusts external build state — it always (re)builds Release itself before packaging. This release's contents are otherwise identical to the intended 0.2.7.1. Previous: 0.2.7.1: the settings page now shows how much storage is used (bar + record count + last cleanup time), turning amber past 80% and red past 95% of the configured cap — this data was already served by the admin status endpoint but never actually displayed anywhere on the page, so there was no way to notice approaching the limit before cleanup silently started evicting older records. No server-side change; reads the existing status endpoint. Previous: 0.2.7.0: new feature — generates real Jellyfin chapter markers from an item's already-stored scene-cut analysis, no re-analysis needed. New 'Chapter markers' section on the settings page (uses the same library/subfolder scope as analysis): a 'Generate chapter markers' button classifies each analyzed item's existing sceneCutProbability time series for hard cuts (same calibrated threshold the desktop client uses for its live scene-cut indicator, ADR-024) and writes them as named chapters. Items that already have chapters are skipped by default — some media ships with real, studio-authored chapters that must not be silently overwritten — with an explicit 'overwrite existing chapters' opt-in for when regeneration is wanted. Items without a stored analysis are skipped, not treated as an error. Previous: 0.2.6.2: fixed a follow-on display bug — a resolved subfolder (0.2.6.1) was always shown flat at the top level instead of at its real position in the tree, and showed TWICE once its real library was expanded. Now the flat placeholder is replaced by the properly-nested row as soon as it's discovered, with a hint on any entry still awaiting that. Previous: 0.2.6.1: fixed a display bug found while building a sibling plugin with the same subfolder picker — a previously-saved SUBFOLDER selection got mislabeled '(removed library ...)' on every settings reload, because the removed-check only knew about top-level libraries at that point in the code (subfolders are discovered lazily, only once their parent is expanded). Now resolves unknown ids via the Items API before assuming they're gone, and shows the real folder name. No change to what gets scanned — display only. Previous: 0.2.6.0: the 'Libraries to analyze' picker in settings can now be narrowed down to specific subfolders, not just whole libraries — click the ▸ next to a library to browse into it and tick individual folders instead. No server-side change needed: AncestorIds (already used to scope the analysis query) works identically for a subfolder's item id as for a library's, so this is a config-page-only addition, fully backward compatible with existing saved selections. Previous: 0.2.5.2: the Server-Analyse button's progress could get stuck reporting 100%/running forever, because a stray progress callback landed after the job was already marked done and silently reverted its status — the analysis itself was always fine, only the status display hung. Fixed. Previous: 0.2.5.1: hotfix — 0.2.5.0 referenced EF Core 9.0.18, but this package deliberately ships without its own EF Core runtime and relies on the exact version Jellyfin 10.11.11 already loads (9.0.11); the mismatch disabled the plugin on load. Reverted to 9.0.11."
