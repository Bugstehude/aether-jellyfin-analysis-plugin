changelog: "0.2.5.1: hotfix — 0.2.5.0 referenced EF Core 9.0.18, but this package deliberately ships without its own EF Core runtime (ExcludeAssets=runtime, to avoid a second native SQLite in the server process) and relies on the exact version Jellyfin 10.11.11 already loads, which is 9.0.11. The mismatch disabled the plugin on load. Reverted to 9.0.11; no functional change from 0.2.5.0 otherwise. Previous: 0.2.5.0: a peer review's worth of hardening — audio content-type checks, decompression can no longer over-allocate from a corrupt size field, shutdown cancels workers instead of racing their disposal, batch uploads reject malformed items cleanly, the write lock now covers server-side analysis too, and release packaging is byte-reproducible across timezones."
