changelog: "0.2.6.1: fixed a display bug found while building a sibling plugin with the same subfolder picker — a previously-saved SUBFOLDER selection got mislabeled '(removed library ...)' on every settings reload, because the removed-check only knew about top-level libraries at that point in the code (subfolders are discovered lazily, only once their parent is expanded). Now resolves unknown ids via the Items API before assuming they're gone, and shows the real folder name. No change to what gets scanned — display only. Previous: 0.2.6.0: the 'Libraries to analyze' picker in settings can now be narrowed down to specific subfolders, not just whole libraries — click the ▸ next to a library to browse into it and tick individual folders instead. No server-side change needed: AncestorIds (already used to scope the analysis query) works identically for a subfolder's item id as for a library's, so this is a config-page-only addition, fully backward compatible with existing saved selections. Previous: 0.2.5.2: the Server-Analyse button's progress could get stuck reporting 100%/running forever, because a stray progress callback landed after the job was already marked done and silently reverted its status — the analysis itself was always fine, only the status display hung. Fixed. Previous: 0.2.5.1: hotfix — 0.2.5.0 referenced EF Core 9.0.18, but this package deliberately ships without its own EF Core runtime and relies on the exact version Jellyfin 10.11.11 already loads (9.0.11); the mismatch disabled the plugin on load. Reverted to 9.0.11."
