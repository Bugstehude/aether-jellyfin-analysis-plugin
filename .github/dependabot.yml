version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      dotnet-patches:
        update-types:
          - patch
    # Diese Pakete sind ABSICHTLICH festgenagelt und dürfen nicht angehoben
    # werden — auch nicht als Patch. Das Plugin liefert bewusst keine eigene
    # EF-Core- und SQLite-Laufzeit mit, sondern läuft auf exakt der, die
    # Jellyfin 12.0.0 bereits im Prozess geladen hat (EF Core 10.0.11). Eine
    # Abweichung deaktiviert das Plugin beim Laden, ohne dass der Build oder
    # die Tests etwas davon merken: genau das ist als 0.2.5.0 ausgeliefert und
    # in 0.2.5.1 zurückgenommen worden, und Dependabot hat denselben Vorschlag
    # danach erneut geöffnet (dotnet-patches → EF Core 9.0.18). Zuletzt von
    # Hand auf 10.0.11 angehoben im Zuge der Jellyfin-12.0-Kompatibilität.
    #
    # Die Testprojekte hängen mit drin, weil sie gegen dieselbe Version testen
    # sollen, die auch ausgeliefert wird — ein Test gegen eine neuere SQLite-Version
    # sagt nichts über die hier festgelegte Server-Laufzeit aus.
    #
    # Anheben nur von Hand, zusammen mit einer neuen Jellyfin-Ziel-ABI.
    ignore:
      - dependency-name: "Microsoft.EntityFrameworkCore*"
      - dependency-name: "Microsoft.Data.Sqlite*"
      - dependency-name: "SQLitePCLRaw*"
      - dependency-name: "dotnet-ef"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
